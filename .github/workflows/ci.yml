name: Tauri Starter CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Rust tests (unit always, live with credentials)
    runs-on: ubuntu-latest
    env:
      KEYMINT_CLIENT_API_KEY: ${{ secrets.KEYMINT_TEST_CLIENT_API_KEY }}
      KEYMINT_PRODUCT_ID: ${{ vars.KEYMINT_TEST_PRODUCT_ID }}
      KEYMINT_TEST_ADMIN_API_KEY: ${{ secrets.KEYMINT_TEST_ADMIN_API_KEY }}
      KEYMINT_TEST_PRODUCT_ID: ${{ vars.KEYMINT_TEST_PRODUCT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Lib tests only: the bin target needs full Tauri bundling
      # (icons, frontend); packaging is verified by tauri build on release.
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --lib
